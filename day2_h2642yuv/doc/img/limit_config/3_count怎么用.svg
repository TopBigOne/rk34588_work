  <text x="230" y="166" font-size="12.5" fill="#334155">count_used = 5（示意）→ 空位 = 24 − 5 = 19 ≥ 1</text>
  <text x="230" y="188" font-size="12.5" font-weight="700" fill="#15803d">✅ 一直不用等。实测：1803 帧全解完，最多只建了 7 块，926 fps</text>
