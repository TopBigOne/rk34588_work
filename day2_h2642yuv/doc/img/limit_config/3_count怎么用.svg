  <rect x="0" y="0" width="1050" height="680" fill="#ffffff"/>
  <text x="525" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">count 怎么用：解码器每解一帧前，先数一数"还有没有空位"</text>
  <text x="525" y="58" text-anchor="middle" font-size="13.5" fill="#334155">空位 = limit_count − count_used（正在被用的块数）；空位 &lt; 1 → 这一帧先不解，等你还帧</text>
  <text x="525" y="78" text-anchor="middle" font-size="12" fill="#64748b">源码：mpp_buffer.cpp 第 394–396 行（算空位），mpp_dec_normal.cpp 第 581–586 行（空位不够就等）</text>
  <rect x="20" y="96" width="1010" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="34" y="118" font-size="15" font-weight="700" fill="#0f172a">A</text>
  <text x="56" y="118" font-size="12.5" font-weight="700" fill="#0f172a">limit_config(bufSize, 24)</text>
  <text x="56" y="138" font-size="12" fill="#475569">正常：每帧马上 deinit</text>
