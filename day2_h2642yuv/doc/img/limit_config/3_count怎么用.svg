  <text x="230" y="291" font-size="12.5" fill="#334155">count_used = 20 + 4 = 24 → 空位 = 24 − 24 = 0 &lt; 1</text>
  <text x="230" y="313" font-size="12.5" font-weight="700" fill="#dc2626">❌ 解码器停下来等空位，等不到。实测：解出 24 帧后卡住，不报错</text>
