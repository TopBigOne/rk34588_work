<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 780" width="1050" height="780" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1050" height="780" fill="#ffffff"/>
  <text x="525" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">mpp_frame_deinit 是怎么把 buffer 还回池子的</text>
  <text x="525" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">左边是调用链（源码位置），右边是这一步做了什么</text>

  <g font-size="13">
    <!-- 1 -->
    <rect x="40" y="76" width="430" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="56" y="100" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#14532d">mpp_frame_deinit(&amp;outputFrame);</text>
    <text x="56" y="124" font-size="12" fill="#475569">你的代码 · src/mpi_dec_most_light.cpp</text>
    <text x="500" y="100" fill="#0f172a">你：这一帧我用完了（已经写进文件）</text>
    <text x="500" y="122" font-size="12" fill="#64748b">注意参数是 &amp;outputFrame：deinit 完会把你的变量置成 NULL</text>
    <path d="M255,140 L255,164" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- 2 -->
    <rect x="40" y="166" width="430" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="56" y="190" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">if (p->buffer)</text>
    <text x="88" y="210" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">mpp_buffer_put(p-&gt;buffer);</text>
    <text x="56" y="234" font-size="12" fill="#475569">mpp_frame.cpp 第 84–85 行</text>
    <text x="500" y="190" fill="#0f172a">MppFrame 只是一个"外壳"（宽高、pts、标志位……），</text>
    <text x="500" y="210" fill="#0f172a">像素在它指向的 MppBuffer 里。先把 buffer 放手；</text>
    <text x="500" y="230" font-size="12" fill="#64748b">外壳本身随后也还给 MPP 的帧对象池（第 93–94 行）</text>
    <path d="M255,246 L255,270" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- 3 -->
    <rect x="40" y="272" width="430" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="56" y="296" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">buffer->ref_count--;</text>
    <text x="56" y="322" font-size="12" fill="#475569">mpp_buffer_put → mpp_buffer_ref_dec · mpp_buffer_impl.cpp 第 526 行</text>
    <text x="500" y="296" fill="#0f172a">引用计数减 1：攥着这块 buffer 的人少了一个</text>
    <text x="500" y="318" font-size="12" fill="#64748b">ref_count = 现在有几方在用它（解码器、你……）</text>
    <path d="M255,336 L255,360" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- 4 diamond -->
    <polygon points="255,362 395,412 255,462 115,412" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <text x="255" y="408" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#78350f">ref_count == 0 ?</text>
    <text x="255" y="428" text-anchor="middle" font-size="11.5" fill="#78350f">第 527 行</text>

    <!-- 否 -->
    <path d="M395,412 L515,412" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="455" y="402" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">否</text>
    <rect x="518" y="372" width="492" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="534" y="396" font-weight="700" fill="#1e3a8a">还有别人在用 → 什么都不做，buffer 留在"使用中"</text>
    <text x="534" y="418" font-size="12" fill="#334155">典型情况：这一帧还是解码器的参考帧（后面的 P 帧要参考它）。</text>
    <text x="534" y="438" font-size="12" fill="#334155">等解码器也不需要它、自己再 put 一次，ref_count 才会减到 0。</text>

    <!-- 是 -->
    <path d="M255,462 L255,488" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="268" y="480" font-size="12.5" font-weight="700" fill="#475569">是</text>

    <!-- 5 -->
    <rect x="40" y="490" width="430" height="74" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="56" y="514" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">reuse = (!is_misc &amp;&amp; !discard);</text>
    <text x="56" y="532" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">put_buffer(group, buffer, reuse, ...);</text>
    <text x="56" y="556" font-size="12" fill="#475569">第 546–547 行</text>
    <text x="500" y="514" fill="#0f172a">没人用了。我们的池子是普通 internal 池子，</text>
    <text x="500" y="534" fill="#0f172a">reuse = 1：<tspan font-weight="700">不销毁，留着复用</tspan></text>
    <path d="M255,564 L255,588" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- 6 -->
    <rect x="40" y="590" width="430" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
    <text x="56" y="614" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">group->count_used--;</text>
    <text x="56" y="634" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">list_add_tail(..., &amp;group->list_unused);</text>
    <text x="56" y="654" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0f172a">group->count_unused++;</text>
    <text x="56" y="674" font-size="12" fill="#475569">第 269–271 行</text>
    <text x="500" y="614" fill="#0f172a">从"使用中"挪到"空闲列表"：</text>
    <text x="500" y="636" fill="#0f172a"><tspan font-weight="700">count_used − 1 → 空位 + 1</tspan>（图 3 里的公式）</text>
    <text x="500" y="658" font-size="12" fill="#64748b">4 MB 内存没有还给系统，还在池子里</text>
    <path d="M255,682 L255,704" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- 7 -->
    <rect x="40" y="706" width="970" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="56" y="730" font-weight="700" fill="#14532d">结果：解码器下一帧调用 mpp_buffer_get 时，先在空闲列表里找到这一块，直接拿去写新像素（mpp_buffer.cpp 第 81 行）</text>
    <text x="56" y="751" font-size="12" fill="#334155">如果一直不 deinit，第 ②～⑥ 步永远走不到：count_used 只增不减，空位减到 0，解码器就停住（图 3 的 B）</text>

    <circle cx="20" cy="108" r="12" fill="#0f172a"/><text x="20" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">①</text>
    <circle cx="20" cy="206" r="12" fill="#0f172a"/><text x="20" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">②</text>
    <circle cx="20" cy="304" r="12" fill="#0f172a"/><text x="20" y="309" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">③</text>
    <circle cx="20" cy="412" r="12" fill="#0f172a"/><text x="20" y="417" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">④</text>
    <circle cx="20" cy="527" r="12" fill="#0f172a"/><text x="20" y="532" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">⑤</text>
    <circle cx="20" cy="636" r="12" fill="#0f172a"/><text x="20" y="641" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">⑥</text>
    <circle cx="20" cy="734" r="12" fill="#0f172a"/><text x="20" y="739" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">⑦</text>
  </g>
</svg>
