<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1100" height="700" fill="#ffffff"/>

  <text x="550" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">struct v4l2_requestbuffers：5 个 __u32，没有嵌套（20 字节）</text>
  <text x="550" y="60" text-anchor="middle" font-size="14" fill="#666">板子实测（2026-10-30）：sizeof = 20，VIDIOC_REQBUFS = 0xc0145608（0x14 = 20）</text>

  <!-- 5 个字段 -->
  <g font-size="14" font-family="Menlo, monospace" text-anchor="middle">
    <rect x="20" y="86" width="200" height="56" rx="4" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
    <text x="120" y="110" font-weight="bold" fill="#9a6700">count</text><text x="120" y="130" font-size="12" fill="#666">字节 0～3</text>
    <rect x="230" y="86" width="200" height="56" rx="4" fill="#ffe8e8" stroke="#cf222e" stroke-width="2"/>
    <text x="330" y="110" font-weight="bold" fill="#cf222e">type</text><text x="330" y="130" font-size="12" fill="#666">字节 4～7</text>
    <rect x="440" y="86" width="200" height="56" rx="4" fill="#ffe8e8" stroke="#cf222e" stroke-width="2"/>
    <text x="540" y="110" font-weight="bold" fill="#cf222e">memory</text><text x="540" y="130" font-size="12" fill="#666">字节 8～11</text>
    <rect x="650" y="86" width="230" height="56" rx="4" fill="#e8f0ff" stroke="#1f6feb" stroke-width="2"/>
    <text x="765" y="110" font-weight="bold" fill="#1f6feb">capabilities</text><text x="765" y="130" font-size="12" fill="#666">字节 12～15</text>
    <rect x="890" y="86" width="190" height="56" rx="4" fill="#f6f8fa" stroke="#999"/>
    <text x="985" y="110" fill="#555">reserved[1]</text><text x="985" y="130" font-size="12" fill="#666">字节 16～19</text>
  </g>

  <!-- 说明 -->
  <rect x="20" y="152" width="200" height="190" rx="6" fill="#ffffff" stroke="#9a6700"/>
  <text x="32" y="176" font-size="14" font-weight="bold" fill="#9a6700">要几块 buffer</text>
  <text x="32" y="200" font-size="12" fill="#333">你填：4</text>
  <text x="32" y="220" font-size="12" fill="#333">驱动写回：实际给了几块</text>
  <text x="32" y="246" font-size="12" fill="#333">实测：1～64 照给</text>
  <text x="32" y="266" font-size="12" fill="#333">　　　100 → 64（上限）</text>
  <text x="32" y="292" font-size="12" fill="#333">填 0 = 全部释放</text>
  <text x="32" y="318" font-size="12" fill="#cf222e">两头都要看：填 + 读回</text>

  <rect x="230" y="152" width="200" height="190" rx="6" fill="#ffffff" stroke="#cf222e"/>
  <text x="242" y="176" font-size="14" font-weight="bold" fill="#cf222e">哪个队列</text>
  <text x="242" y="200" font-size="12" fill="#333">和 v4l2_format 的 type</text>
  <text x="242" y="220" font-size="12" fill="#333">是同一个 enum</text>
  <text x="242" y="246" font-size="12" font-family="Menlo, monospace" fill="#333">9 = CAPTURE_MPLANE</text>
  <text x="242" y="272" font-size="12" fill="#333">实测填 1 → EINVAL</text>
  <text x="242" y="298" font-size="12" fill="#666">S_FMT、REQBUFS、QBUF…</text>
  <text x="242" y="318" font-size="12" fill="#666">所有 type 要填一样的</text>

  <rect x="440" y="152" width="200" height="190" rx="6" fill="#ffffff" stroke="#cf222e"/>
  <text x="452" y="176" font-size="14" font-weight="bold" fill="#cf222e">内存从哪来</text>
  <text x="452" y="200" font-size="12" fill="#333">enum v4l2_memory，见下面</text>
  <text x="452" y="226" font-size="12" font-family="Menlo, monospace" fill="#333">1 = MMAP ← 我们用</text>
  <text x="452" y="252" font-size="12" fill="#666">之后 QUERYBUF、QBUF、</text>
  <text x="452" y="272" font-size="12" fill="#666">DQBUF 的 memory</text>
  <text x="452" y="292" font-size="12" fill="#666">都要填一样的</text>

  <rect x="650" y="152" width="230" height="190" rx="6" fill="#ffffff" stroke="#1f6feb"/>
  <text x="662" y="176" font-size="14" font-weight="bold" fill="#1f6feb">驱动能做什么（回执）</text>
  <text x="662" y="200" font-size="12" fill="#333">你不用填，驱动写回</text>
  <text x="662" y="220" font-size="12" fill="#333">一组"能 / 不能"的开关位</text>
  <text x="662" y="246" font-size="12" fill="#333">实测 video22：</text>
  <text x="662" y="268" font-size="13" font-family="Menlo, monospace" font-weight="bold" fill="#1f6feb">0x57</text>
  <text x="662" y="292" font-size="12" fill="#333">= 0101 0111（二进制）</text>
  <text x="662" y="316" font-size="12" fill="#666">拆开见右下表</text>

  <rect x="890" y="152" width="190" height="190" rx="6" fill="#ffffff" stroke="#999"/>
  <text x="902" y="176" font-size="14" font-weight="bold" fill="#555">保留</text>
  <text x="902" y="200" font-size="12" fill="#333">必须是 0</text>
  <text x="902" y="220" font-size="12" fill="#333">→ 先 = {} 清零</text>

  <!-- 左下：memory 4 种 -->
  <text x="20" y="384" font-size="15" font-weight="bold" fill="#333">memory 的 4 个值（enum v4l2_memory）</text>
  <g font-size="12">
    <rect x="20" y="396" width="520" height="34" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="30" y="418" font-family="Menlo, monospace" font-weight="bold" fill="#1a7f37">1 MMAP</text>
    <text x="140" y="418" fill="#333">驱动分配内存，你 mmap 过来用 ← 我们用 ✓ 实测可以</text>
    <rect x="20" y="430" width="520" height="34" fill="#ffffff" stroke="#999"/>
    <text x="30" y="452" font-family="Menlo, monospace" fill="#333">2 USERPTR</text>
    <text x="140" y="452" fill="#333">你自己 malloc，把指针交给驱动　✓ 实测可以</text>
    <rect x="20" y="464" width="520" height="34" fill="#ffffff" stroke="#999"/>
    <text x="30" y="486" font-family="Menlo, monospace" fill="#333">3 OVERLAY</text>
    <text x="140" y="486" fill="#333">叠加窗口用（老电视卡）　✗ 实测 EINVAL</text>
    <rect x="20" y="498" width="520" height="34" fill="#ffffff" stroke="#999"/>
    <text x="30" y="520" font-family="Menlo, monospace" fill="#333">4 DMABUF</text>
    <text x="140" y="520" fill="#333">别人分配好（给 dma_buf fd），驱动直接用　✓ 实测可以</text>
  </g>
  <text x="20" y="556" font-size="12" fill="#666">三种方式的区别见图 3</text>

  <!-- 右下：caps 0x57 -->
  <text x="570" y="384" font-size="15" font-weight="bold" fill="#333">capabilities = 0x57 拆开（V4L2_BUF_CAP_*）</text>
  <g font-size="12" font-family="Menlo, monospace">
    <text x="570" y="414" fill="#666">位</text>
    <text x="610" y="414" fill="#666">值</text>
    <text x="670" y="414" fill="#666">名字</text>
    <text x="1030" y="414" fill="#666">video22</text>
    <text x="570" y="444" fill="#1a7f37">0</text>
    <text x="610" y="444" fill="#1a7f37">0x01</text>
    <text x="670" y="444" fill="#1a7f37">SUPPORTS_MMAP</text>
    <text x="1030" y="444" fill="#1a7f37">✓</text>
    <text x="570" y="466" fill="#1a7f37">1</text>
    <text x="610" y="466" fill="#1a7f37">0x02</text>
    <text x="670" y="466" fill="#1a7f37">SUPPORTS_USERPTR</text>
    <text x="1030" y="466" fill="#1a7f37">✓</text>
    <text x="570" y="488" fill="#1a7f37">2</text>
    <text x="610" y="488" fill="#1a7f37">0x04</text>
    <text x="670" y="488" fill="#1a7f37">SUPPORTS_DMABUF</text>
    <text x="1030" y="488" fill="#1a7f37">✓</text>
    <text x="570" y="510" fill="#999">3</text>
    <text x="610" y="510" fill="#999">0x08</text>
    <text x="670" y="510" fill="#999">SUPPORTS_REQUESTS</text>
    <text x="1030" y="510" fill="#999">✗</text>
    <text x="570" y="532" fill="#1a7f37">4</text>
    <text x="610" y="532" fill="#1a7f37">0x10</text>
    <text x="670" y="532" fill="#1a7f37">SUPPORTS_ORPHANED_BUFS</text>
    <text x="1030" y="532" fill="#1a7f37">✓</text>
    <text x="570" y="554" fill="#999">5</text>
    <text x="610" y="554" fill="#999">0x20</text>
    <text x="670" y="554" fill="#999">SUPPORTS_M2M_HOLD_CAPTURE_BUF</text>
    <text x="1030" y="554" fill="#999">✗</text>
    <text x="570" y="576" fill="#1a7f37">6</text>
    <text x="610" y="576" fill="#1a7f37">0x40</text>
    <text x="670" y="576" fill="#1a7f37">SUPPORTS_MMAP_CACHE_HINTS</text>
    <text x="1030" y="576" fill="#1a7f37">✓</text>
    <line x1="570" y1="422" x2="1080" y2="422" stroke="#ccc"/>
    <text x="570" y="606" fill="#333">0x01+0x02+0x04+0x10+0x40 = 0x57</text>
  </g>

  <rect x="20" y="624" width="1060" height="60" rx="8" fill="#ffffff" stroke="#444"/>
  <text x="40" y="650" font-size="13" fill="#333">黄色 = 你填、驱动也会改；红色 = 你填，必须和其他 ioctl 一致；蓝色 = 只有驱动写；灰色 = 清零。</text>
  <text x="40" y="672" font-size="13" fill="#333">和 v4l2_format 比：没有 union、没有嵌套，一眼看完。难的不是结构体，而是"这一步驱动在背后做了什么"（图 2）。</text>
</svg>
