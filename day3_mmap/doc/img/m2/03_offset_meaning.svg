<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">mmap 最后一个参数 offset：对两种 fd 意思不一样</text>
  <text x="550" y="60" text-anchor="middle" font-size="14" fill="#666">板子实测（2026-10-31）：每块 0x2fd000 字节</text>

  <!-- 上：videoFd -->
  <rect x="30" y="80" width="1040" height="220" rx="8" fill="#f5f9ff" stroke="#1f6feb"/>
  <text x="50" y="108" font-size="16" font-weight="bold" fill="#1f6feb">videoFd：一个 fd 管 4 块 → offset = "取件号"，选第几块</text>
  <g font-size="13" font-family="Menlo, monospace" text-anchor="middle">
    <rect x="60" y="130" width="230" height="56" rx="4" fill="#ddeaff" stroke="#1f6feb" stroke-width="2"/>
    <text x="175" y="154" fill="#1f6feb" font-weight="bold">第 0 块</text><text x="175" y="174" fill="#333">mem_offset 0</text>
    <rect x="300" y="130" width="230" height="56" rx="4" fill="#ffffff" stroke="#1f6feb"/>
    <text x="415" y="154" fill="#1f6feb">第 1 块</text><text x="415" y="174" fill="#333">mem_offset 0x2fd000</text>
    <rect x="540" y="130" width="230" height="56" rx="4" fill="#ffffff" stroke="#1f6feb"/>
    <text x="655" y="154" fill="#1f6feb">第 2 块</text><text x="655" y="174" fill="#333">mem_offset 0x5fa000</text>
    <rect x="780" y="130" width="230" height="56" rx="4" fill="#ffffff" stroke="#1f6feb"/>
    <text x="895" y="154" fill="#1f6feb">第 3 块</text><text x="895" y="174" fill="#333">mem_offset 0x8f7000</text>
  </g>
  <g font-size="13" fill="#333">
    <text x="60" y="216">mmap(videoFd, offset = 0x2fd000)  → 驱动拿 offset 去找"哪一块的开头是它" → 第 1 块，整块映射过来</text>
    <text x="60" y="240" fill="#1a7f37">✓ 0、0x2fd000、0x5fa000、0x8f7000：正好是某一块的开头，可以</text>
    <text x="60" y="264" fill="#cf222e">✗ 0x2fe000（第 1 块开头 + 4096）：不是任何一块的开头 → EINVAL（实测）</text>
    <text x="60" y="288" fill="#cf222e">✗ MAP_PRIVATE：videobuf2 要求必须 MAP_SHARED → EINVAL（实测；4.4 源码 videobuf2-core.c 第 1955 行）</text>
  </g>

  <!-- 下：dmaBufFd -->
  <rect x="30" y="316" width="1040" height="226" rx="8" fill="#f3fbf5" stroke="#1a7f37"/>
  <text x="50" y="344" font-size="16" font-weight="bold" fill="#1a7f37">dmaBufFd：一个 fd 只代表 1 块 → offset = "从这一块里的哪儿开始"</text>
  <rect x="60" y="364" width="950" height="44" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <line x1="100" y1="364" x2="100" y2="408" stroke="#1a7f37" stroke-dasharray="3 3"/>
  <line x1="140" y1="364" x2="140" y2="408" stroke="#1a7f37" stroke-dasharray="3 3"/>
  <text x="535" y="391" text-anchor="middle" font-size="13" font-family="Menlo, monospace" fill="#1a7f37">第 0 块（EXPBUF 时选定的那一块），0 ～ 0x2fd000</text>
  <text x="60" y="426" font-size="11" font-family="Menlo, monospace" fill="#666">0</text>
  <text x="92" y="426" font-size="11" font-family="Menlo, monospace" fill="#666">4096</text>
  <text x="975" y="426" font-size="11" font-family="Menlo, monospace" fill="#666">0x2fd000</text>
  <g font-size="13" fill="#333">
    <text x="60" y="452" fill="#1a7f37">✓ offset 0，长度 0x2fd000：整块（M2 用的就是这个）</text>
    <text x="60" y="476" fill="#1a7f37">✓ offset 4096，长度 4096：只映射第 1 页（实测可以，图上两条虚线之间）</text>
    <text x="60" y="500" fill="#cf222e">✗ offset 0x2fd000，或者长度 0x2fd000 + 4096：超出这一块 → EINVAL（实测；4.4 源码 dma-buf.c 第 91～93 行）</text>
    <text x="60" y="524" fill="#666">想要第 1 块？不能靠 offset，要对第 1 块再 EXPBUF 一次，拿另一个 dmaBufFd</text>
  </g>
</svg>
