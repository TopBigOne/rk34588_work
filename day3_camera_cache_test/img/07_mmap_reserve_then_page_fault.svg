<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1100" height="760" fill="#ffffff"/>
  <defs>
    <marker id="aG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="aR" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <text x="550" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">mmap 先"预留"地址，第一次碰到某一页时才真正接上物理页（缺页）</text>
  <text x="550" y="60" text-anchor="middle" font-size="14" fill="#666">实验 2 实测（Mac，一页 16 KB）：mmap 1 GB 后占用 0 MB；碰了前 256 MB → 占用 256 MB、缺页 +16,384 次（= 256 MB ÷ 16 KB）</text>

  <!-- 阶段 1 -->
  <rect x="20" y="80" width="340" height="440" rx="10" fill="#f6f8fa" stroke="#888"/>
  <text x="190" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">阶段 1：调用 mmap 之前</text>
  <rect x="50" y="125" width="280" height="300" fill="#ffffff" stroke="#bbb" stroke-dasharray="5,3"/>
  <text x="190" y="270" text-anchor="middle" font-size="13" fill="#999">这段地址没人用</text>
  <text x="190" y="290" text-anchor="middle" font-size="13" fill="#999">页表里没有记录</text>
  <text x="190" y="460" text-anchor="middle" font-size="13" fill="#333">访问它 → 段错误</text>
  <text x="190" y="490" text-anchor="middle" font-size="13" fill="#333">RSS（实际占用）：0</text>

  <!-- 阶段 2 -->
  <rect x="380" y="80" width="340" height="440" rx="10" fill="#f3f8ff" stroke="#1f6feb"/>
  <text x="550" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6feb">阶段 2：mmap 刚返回</text>
  <rect x="410" y="125" width="280" height="300" fill="#e8f0ff" stroke="#1f6feb"/>
  <text x="550" y="150" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#222">mapAddr = 0x120000000</text>
  <g fill="#ffffff" stroke="#1f6feb" stroke-dasharray="4,3">
    <rect x="430" y="170" width="240" height="34"/><rect x="430" y="210" width="240" height="34"/>
    <rect x="430" y="250" width="240" height="34"/><rect x="430" y="290" width="240" height="34"/>
    <rect x="430" y="330" width="240" height="34"/>
  </g>
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="550" y="192">第 0 页：已预留，还没物理页</text><text x="550" y="232">第 1 页：已预留，还没物理页</text>
    <text x="550" y="272">第 2 页：已预留，还没物理页</text><text x="550" y="312">……</text>
    <text x="550" y="352">第 65535 页（1 GB 的最后一页）</text>
  </g>
  <text x="550" y="400" text-anchor="middle" font-size="12" fill="#1f6feb">内核只记了一笔："这 1 GB 归你，来源是 X"</text>
  <text x="550" y="460" text-anchor="middle" font-size="13" fill="#333">访问它 → 不会段错误（已登记）</text>
  <text x="550" y="490" text-anchor="middle" font-size="13" fill="#333">RSS：<tspan font-weight="bold">还是 0 MB</tspan>（实测）</text>

  <!-- 阶段 3 -->
  <rect x="740" y="80" width="340" height="440" rx="10" fill="#f1fbf3" stroke="#1a7f37"/>
  <text x="910" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a7f37">阶段 3：第一次写 mapAddr[0]</text>
  <rect x="770" y="125" width="280" height="300" fill="#e9f7ec" stroke="#1a7f37"/>
  <rect x="790" y="170" width="240" height="34" fill="#c9efd2" stroke="#1a7f37" stroke-width="2"/>
  <text x="910" y="192" text-anchor="middle" font-size="12" fill="#222">第 0 页 → 物理页 #5021 ✓</text>
  <g fill="#ffffff" stroke="#1a7f37" stroke-dasharray="4,3">
    <rect x="790" y="210" width="240" height="34"/><rect x="790" y="250" width="240" height="34"/>
    <rect x="790" y="290" width="240" height="34"/><rect x="790" y="330" width="240" height="34"/>
  </g>
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="910" y="232">第 1 页：还没碰，还没物理页</text><text x="910" y="272">第 2 页：还没碰</text>
    <text x="910" y="312">……</text><text x="910" y="352">第 65535 页：还没碰</text>
  </g>
  <text x="910" y="400" text-anchor="middle" font-size="12" fill="#1a7f37">碰到哪页，才补哪页</text>
  <text x="910" y="460" text-anchor="middle" font-size="13" fill="#333">碰完前 256 MB 后</text>
  <text x="910" y="490" text-anchor="middle" font-size="13" fill="#333">RSS：<tspan font-weight="bold">256 MB</tspan>（实测）</text>

  <path d="M360,300 L376,300" stroke="#1f6feb" stroke-width="2.5" fill="none" marker-end="url(#aG)"/>
  <path d="M720,300 L736,300" stroke="#1a7f37" stroke-width="2.5" fill="none" marker-end="url(#aG)"/>

  <!-- 缺页流程 -->
  <rect x="20" y="540" width="1060" height="200" rx="10" fill="#fffdf6" stroke="#e0c000" stroke-dasharray="5,3"/>
  <text x="40" y="566" font-size="14" font-weight="bold" fill="#5c4b00">"缺页"（page fault）的过程：第一次访问某一页时，一瞬间发生的事</text>
  <g font-size="12">
    <rect x="40" y="582" width="230" height="64" rx="6" fill="#ffffff" stroke="#cf222e"/>
    <text x="155" y="604" text-anchor="middle" fill="#222">① CPU 访问 mapAddr[0]</text>
    <text x="155" y="624" text-anchor="middle" fill="#666">MMU 查页表：没有物理页</text>
    <text x="155" y="640" text-anchor="middle" fill="#cf222e">→ 暂停程序，喊内核</text>
    <rect x="300" y="582" width="230" height="64" rx="6" fill="#ffffff" stroke="#c26a00"/>
    <text x="415" y="604" text-anchor="middle" fill="#222">② 内核查记录：这页归你，</text>
    <text x="415" y="624" text-anchor="middle" fill="#666">来源是 X（匿名 / 文件 / 设备）</text>
    <text x="415" y="640" text-anchor="middle" fill="#c26a00">→ 问来源要一个物理页</text>
    <rect x="560" y="582" width="230" height="64" rx="6" fill="#ffffff" stroke="#1a7f37"/>
    <text x="675" y="604" text-anchor="middle" fill="#222">③ 把"这页 → 物理页"</text>
    <text x="675" y="624" text-anchor="middle" fill="#666">填进页表</text>
    <text x="675" y="640" text-anchor="middle" fill="#1a7f37">→ 让程序接着跑</text>
    <rect x="820" y="582" width="240" height="64" rx="6" fill="#ffffff" stroke="#1f6feb"/>
    <text x="940" y="604" text-anchor="middle" fill="#222">④ 程序完全没察觉</text>
    <text x="940" y="624" text-anchor="middle" fill="#666">只是这一次访问慢了一点</text>
    <text x="940" y="640" text-anchor="middle" fill="#1f6feb">下次访问同一页：直接命中</text>
  </g>
  <path d="M270,614 L296,614" stroke="#cf222e" stroke-width="2" fill="none" marker-end="url(#aR)"/>
  <path d="M530,614 L556,614" stroke="#c26a00" stroke-width="2" fill="none" marker-end="url(#aR)"/>
  <path d="M790,614 L816,614" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#aG)"/>
  <text x="40" y="676" font-size="13" fill="#333">· 这就是 cache 探针为什么要先 memset 一遍：让每一页都提前"缺页"补好，测速时就不会把补页的时间算进去。</text>
  <text x="40" y="700" font-size="13" fill="#333">· 摄像头 buffer、dma_buf 的物理页在 REQBUFS / ALLOC 时就分好了，mmap 后第一次访问只是"把已有的页填进页表"，不用新分配。</text>
  <text x="40" y="724" font-size="13" fill="#333">· 物理页号 #5021 只是示意。</text>
</svg>
