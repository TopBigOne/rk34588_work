<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1040" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c6fb0"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="520" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">n0_nvr_mosaic：4 个解码线程 + 1 个主线程</text>
  <text x="520" y="54" font-size="13" text-anchor="middle" fill="#555">每一路一个 MppCtx、一个线程、一个队列；主线程每轮从 4 个队列各取一帧，用 RGA 贴进大图里自己的格子</text>

  <!-- ===== 左边：4 路 DecodeChannel ===== -->
  <text x="225" y="86" font-size="14" font-weight="bold" text-anchor="middle" fill="#2f6b22">4 个 DecodeChannel（M1 起）</text>

  <!-- ch0 -->
  <rect x="20" y="98" width="410" height="100" rx="8" fill="#eef6ee" stroke="#4e9a3a"/>
  <text x="34" y="120" font-size="13" font-weight="bold" fill="#2f6b22">ch0 · 解码线程 0</text>
  <text x="34" y="142" font-size="12" fill="#333">aaa.264（H.264 1920×1080，1803 帧）</text>
  <rect x="34" y="154" width="200" height="32" rx="5" fill="#ffffff" stroke="#4e9a3a"/>
  <text x="134" y="175" font-size="12" text-anchor="middle" fill="#222">DecodeStage → MppDecoder</text>
  <line x1="236" y1="170" x2="276" y2="170" stroke="#4e9a3a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="282" y="154" width="136" height="32" rx="5" fill="#ffffff" stroke="#2c6fb0"/>
  <rect x="290" y="160" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <rect x="316" y="160" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <rect x="342" y="160" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <rect x="368" y="160" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <text x="404" y="175" font-size="10" text-anchor="middle" fill="#2c6fb0">≤4</text>
  <text x="350" y="147" font-size="11" text-anchor="middle" fill="#2c6fb0">FrameQueue</text>

  <!-- ch1 -->
  <rect x="20" y="210" width="410" height="100" rx="8" fill="#eef6ee" stroke="#4e9a3a"/>
  <text x="34" y="232" font-size="13" font-weight="bold" fill="#2f6b22">ch1 · 解码线程 1</text>
  <text x="34" y="254" font-size="12" fill="#333">out_720p.h265（H.265 1280×720，1803 帧）</text>
  <rect x="34" y="266" width="200" height="32" rx="5" fill="#ffffff" stroke="#4e9a3a"/>
  <text x="134" y="287" font-size="12" text-anchor="middle" fill="#222">DecodeStage → MppDecoder</text>
  <line x1="236" y1="282" x2="276" y2="282" stroke="#4e9a3a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="282" y="266" width="136" height="32" rx="5" fill="#ffffff" stroke="#2c6fb0"/>
  <rect x="290" y="272" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <rect x="316" y="272" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <rect x="342" y="272" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <rect x="368" y="272" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <text x="404" y="287" font-size="10" text-anchor="middle" fill="#2c6fb0">≤4</text>
  <text x="350" y="259" font-size="11" text-anchor="middle" fill="#2c6fb0">FrameQueue</text>

  <!-- ch2 -->
  <rect x="20" y="322" width="410" height="100" rx="8" fill="#eef6ee" stroke="#4e9a3a"/>
  <text x="34" y="344" font-size="13" font-weight="bold" fill="#2f6b22">ch2 · 解码线程 2</text>
  <text x="34" y="366" font-size="12" fill="#333">main_1080p.h264（H.264 1920×1080，60 帧）</text>
  <rect x="34" y="378" width="200" height="32" rx="5" fill="#ffffff" stroke="#4e9a3a"/>
  <text x="134" y="399" font-size="12" text-anchor="middle" fill="#222">DecodeStage → MppDecoder</text>
  <line x1="236" y1="394" x2="276" y2="394" stroke="#4e9a3a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="282" y="378" width="136" height="32" rx="5" fill="#ffffff" stroke="#2c6fb0"/>
  <rect x="290" y="384" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <rect x="316" y="384" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <rect x="342" y="384" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <rect x="368" y="384" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <text x="404" y="399" font-size="10" text-anchor="middle" fill="#2c6fb0">≤4</text>
  <text x="350" y="371" font-size="11" text-anchor="middle" fill="#2c6fb0">FrameQueue</text>

  <!-- ch3 -->
  <rect x="20" y="434" width="410" height="100" rx="8" fill="#eef6ee" stroke="#4e9a3a"/>
  <text x="34" y="456" font-size="13" font-weight="bold" fill="#2f6b22">ch3 · 解码线程 3</text>
  <text x="34" y="478" font-size="12" fill="#333">out.h265（H.265 1920×1080，60 帧）</text>
  <rect x="34" y="490" width="200" height="32" rx="5" fill="#ffffff" stroke="#4e9a3a"/>
  <text x="134" y="511" font-size="12" text-anchor="middle" fill="#222">DecodeStage → MppDecoder</text>
  <line x1="236" y1="506" x2="276" y2="506" stroke="#4e9a3a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="282" y="490" width="136" height="32" rx="5" fill="#ffffff" stroke="#2c6fb0"/>
  <rect x="290" y="496" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <rect x="316" y="496" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <rect x="342" y="496" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <rect x="368" y="496" width="22" height="20" fill="#cfe0f3" stroke="#2c6fb0"/>
  <text x="404" y="511" font-size="10" text-anchor="middle" fill="#2c6fb0">≤4</text>
  <text x="350" y="483" font-size="11" text-anchor="middle" fill="#2c6fb0">FrameQueue</text>

  <text x="225" y="560" font-size="12" text-anchor="middle" fill="#555">M1 只有左边这一列：解出来的帧直接释放，只数帧数</text>

  <!-- ===== 中间：主线程 ===== -->
  <rect x="490" y="98" width="250" height="436" rx="8" fill="#fff4e0" stroke="#d08a3a"/>
  <text x="615" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#8a5a1c">主线程（M2 起）</text>
  <text x="615" y="146" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">MosaicComposeStage</text>
  <text x="615" y="166" font-size="12" text-anchor="middle" fill="#333">composeNextMosaic()</text>
  <text x="615" y="190" font-size="11" text-anchor="middle" fill="#555">每轮：4 个队列各 pop 一帧</text>
  <text x="615" y="208" font-size="11" text-anchor="middle" fill="#555">RGA improcess 缩放贴进格子</text>
  <text x="615" y="226" font-size="11" text-anchor="middle" fill="#555">帧释放 → buffer 回到那一路解码器</text>

  <!-- 2x2 大图 -->
  <rect x="525" y="250" width="180" height="102" fill="#ffffff" stroke="#8a5a1c" stroke-width="2"/>
  <line x1="615" y1="250" x2="615" y2="352" stroke="#8a5a1c"/>
  <line x1="525" y1="301" x2="705" y2="301" stroke="#8a5a1c"/>
  <text x="570" y="281" font-size="13" text-anchor="middle" fill="#222">ch0</text>
  <text x="660" y="281" font-size="13" text-anchor="middle" fill="#222">ch1</text>
  <text x="570" y="332" font-size="13" text-anchor="middle" fill="#222">ch2</text>
  <text x="660" y="332" font-size="13" text-anchor="middle" fill="#222">ch3</text>
  <text x="615" y="372" font-size="11" text-anchor="middle" fill="#555">大图 1920×1080，每格 960×540</text>
  <text x="615" y="390" font-size="11" text-anchor="middle" fill="#555">只有一块 buffer，每轮在上面改</text>
  <text x="615" y="420" font-size="11" text-anchor="middle" fill="#555">某一路解完：不再 pop，</text>
  <text x="615" y="438" font-size="11" text-anchor="middle" fill="#555">它的格子停在最后一帧</text>
  <text x="615" y="468" font-size="11" text-anchor="middle" fill="#555">4 路都解完：</text>
  <text x="615" y="486" font-size="11" text-anchor="middle" fill="#555">返回 AllChannelsEnded</text>

  <!-- 队列 → 主线程 -->
  <line x1="418" y1="170" x2="486" y2="250" stroke="#2c6fb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="418" y1="282" x2="486" y2="290" stroke="#2c6fb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="418" y1="394" x2="486" y2="320" stroke="#2c6fb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="418" y1="506" x2="486" y2="350" stroke="#2c6fb0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="438" y="196" font-size="11" fill="#2c6fb0">pop</text>

  <!-- ===== 右边：输出 ===== -->
  <text x="900" y="86" font-size="14" font-weight="bold" text-anchor="middle" fill="#5a3e8a">大图拼好以后</text>

  <rect x="780" y="98" width="240" height="96" rx="8" fill="#f3eefa" stroke="#7a5ab0"/>
  <text x="900" y="122" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">M2：Nv12FileWriter</text>
  <text x="900" y="144" font-size="12" text-anchor="middle" fill="#333">抽第 30、300 张存原始 NV12</text>
  <text x="900" y="164" font-size="11" text-anchor="middle" fill="#555">mosaic_m2_snapshots.yuv</text>
  <text x="900" y="182" font-size="11" text-anchor="middle" fill="#555">Mac 上转成 PNG 看</text>

  <rect x="780" y="218" width="240" height="116" rx="8" fill="#f3eefa" stroke="#7a5ab0"/>
  <text x="900" y="242" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">M3：EncodeStage</text>
  <text x="900" y="264" font-size="12" text-anchor="middle" fill="#333">MppEncoder H.265 4 Mbps</text>
  <text x="900" y="284" font-size="12" text-anchor="middle" fill="#333">+ StreamFileWriter</text>
  <text x="900" y="306" font-size="11" text-anchor="middle" fill="#555">每张大图编一帧</text>
  <text x="900" y="324" font-size="11" text-anchor="middle" fill="#555">mosaic.h265</text>

  <rect x="780" y="358" width="240" height="116" rx="8" fill="#ffffff" stroke="#7a5ab0" stroke-dasharray="6,4"/>
  <text x="900" y="382" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">M4（可选）：同 M3</text>
  <text x="900" y="404" font-size="12" text-anchor="middle" fill="#333">输出路径换成命名管道 FIFO</text>
  <text x="900" y="426" font-size="12" text-anchor="middle" fill="#333">另一头 gst-launch 读</text>
  <text x="900" y="446" font-size="11" text-anchor="middle" fill="#555">mppvideodec → waylandsink</text>
  <text x="900" y="464" font-size="11" text-anchor="middle" fill="#555">显示到 HDMI 屏</text>

  <line x1="740" y1="150" x2="776" y2="146" stroke="#7a5ab0" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="740" y1="276" x2="776" y2="276" stroke="#7a5ab0" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="740" y1="410" x2="776" y2="414" stroke="#7a5ab0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>
</svg>
