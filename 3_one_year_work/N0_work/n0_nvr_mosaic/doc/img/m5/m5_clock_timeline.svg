<text x="20" y="487" font-size="12" fill="#555">圆点的横坐标 = 帧的时间戳（第几帧 × 1000000 / 帧率，单位微秒）。</text>
<text x="20" y="507" font-size="12" fill="#555">ch3 是示意（卡顿缩短成 3 拍）：实际是第 300 帧前停 2 秒，约 60 拍重复；恢复后每拍最多取出 4 帧（队列容量）、丢 3 帧。</text>
