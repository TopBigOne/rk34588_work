<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="490" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">M2 文件双码流：每一帧走两条路</text>

  <!-- 输入文件 -->
  <rect x="20" y="200" width="150" height="80" rx="8" fill="#f2f2f2" stroke="#888"/>
  <text x="95" y="230" font-size="14" text-anchor="middle" fill="#222">in_1080p_60f.nv12</text>
  <text x="95" y="252" font-size="12" text-anchor="middle" fill="#555">60 帧首尾相连</text>
  <text x="95" y="270" font-size="12" text-anchor="middle" fill="#555">每帧 3110400 字节</text>

  <!-- 读帧 -->
  <line x1="170" y1="240" x2="228" y2="240" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="199" y="222" font-size="11" text-anchor="middle" fill="#555">CPU fread</text>
  <text x="199" y="262" font-size="11" text-anchor="middle" fill="#555">+ sync</text>

  <!-- MppBufferGroup 背景框 -->
  <rect x="232" y="60" width="270" height="440" rx="10" fill="#eef6ff" stroke="#6aa0d8" stroke-dasharray="6,4"/>
  <text x="367" y="84" font-size="13" text-anchor="middle" fill="#2c5d93">MppBufferGroup（DRM，CACHABLE）</text>
  <text x="367" y="102" font-size="12" text-anchor="middle" fill="#2c5d93">两块 buffer 都从这里申请，只申请一次</text>

  <!-- pictureMain -->
  <rect x="250" y="160" width="234" height="96" rx="8" fill="#ffffff" stroke="#2c5d93" stroke-width="2"/>
  <text x="367" y="186" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">pictureMain.mppBuf</text>
  <text x="367" y="208" font-size="12" text-anchor="middle" fill="#444">1920 x 1080</text>
  <text x="367" y="226" font-size="12" text-anchor="middle" fill="#444">stride 1920 x 1088</text>
  <text x="367" y="244" font-size="12" text-anchor="middle" fill="#444">3133440 字节，每圈覆盖</text>

  <!-- pictureSub -->
  <rect x="250" y="380" width="234" height="96" rx="8" fill="#ffffff" stroke="#2c5d93" stroke-width="2"/>
  <text x="367" y="406" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">pictureSub.mppBuf</text>
  <text x="367" y="428" font-size="12" text-anchor="middle" fill="#444">1280 x 720</text>
  <text x="367" y="446" font-size="12" text-anchor="middle" fill="#444">stride 1280 x 720</text>
  <text x="367" y="464" font-size="12" text-anchor="middle" fill="#444">1382400 字节，每圈覆盖</text>

  <!-- RGA -->
  <line x1="367" y1="256" x2="367" y2="292" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="285" y="296" width="164" height="54" rx="8" fill="#fff4e0" stroke="#d08a1a" stroke-width="2"/>
  <text x="367" y="318" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">RGA imresize</text>
  <text x="367" y="338" font-size="12" text-anchor="middle" fill="#7a4d00">实测 2.65 ms/帧</text>
  <line x1="367" y1="350" x2="367" y2="376" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="318" font-size="11" fill="#7a4d00">读写都用 fd，</text>
  <text x="462" y="334" font-size="11" fill="#7a4d00">不经过 CPU</text>

  <!-- 主编码器 -->
  <line x1="484" y1="208" x2="578" y2="208" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="582" y="160" width="180" height="96" rx="8" fill="#eaf7ea" stroke="#3c8f3c" stroke-width="2"/>
  <text x="672" y="186" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">mainEncoder</text>
  <text x="672" y="208" font-size="12" text-anchor="middle" fill="#444">MppEncoder 实例 #1</text>
  <text x="672" y="226" font-size="12" text-anchor="middle" fill="#444">H.264 High，4 Mbps</text>
  <text x="672" y="244" font-size="12" text-anchor="middle" fill="#444">gop 60</text>

  <!-- 子编码器 -->
  <line x1="484" y1="428" x2="578" y2="428" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="582" y="380" width="180" height="96" rx="8" fill="#eaf7ea" stroke="#3c8f3c" stroke-width="2"/>
  <text x="672" y="406" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">subEncoder</text>
  <text x="672" y="428" font-size="12" text-anchor="middle" fill="#444">MppEncoder 实例 #2</text>
  <text x="672" y="446" font-size="12" text-anchor="middle" fill="#444">H.264 High，1.5 Mbps</text>
  <text x="672" y="464" font-size="12" text-anchor="middle" fill="#444">gop 60</text>

  <!-- 输出文件 -->
  <line x1="762" y1="208" x2="806" y2="208" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="810" y="168" width="150" height="80" rx="8" fill="#f2f2f2" stroke="#888"/>
  <text x="885" y="196" font-size="13" text-anchor="middle" fill="#222">main_1080p.h264</text>
  <text x="885" y="216" font-size="12" text-anchor="middle" fill="#555">898624 字节</text>
  <text x="885" y="234" font-size="12" text-anchor="middle" fill="#555">≈ 3.6 Mbps</text>

  <line x1="762" y1="428" x2="806" y2="428" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="810" y="388" width="150" height="80" rx="8" fill="#f2f2f2" stroke="#888"/>
  <text x="885" y="416" font-size="13" text-anchor="middle" fill="#222">sub_720p.h264</text>
  <text x="885" y="436" font-size="12" text-anchor="middle" fill="#555">337773 字节</text>
  <text x="885" y="454" font-size="12" text-anchor="middle" fill="#555">≈ 1.35 Mbps</text>

  <text x="672" y="320" font-size="12" text-anchor="middle" fill="#555">两个编码器互不影响：</text>
  <text x="672" y="338" font-size="12" text-anchor="middle" fill="#555">各自一个 MppCtx、各自的参数</text>
  <text x="672" y="356" font-size="12" text-anchor="middle" fill="#555">各自写 SPS/PPS</text>

  <text x="490" y="512" font-size="11" text-anchor="middle" fill="#777">2026-11-06 板子实测：60 帧，两路各 60 帧，ffmpeg 完整解码无错</text>
</svg>
