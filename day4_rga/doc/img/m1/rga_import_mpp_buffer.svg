<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c6fb0"/>
    </marker>
  </defs>

  <text x="500" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">import_mpp_buffer_to_rga：把一块 MppBuffer 登记给 RGA</text>
  <text x="500" y="54" font-size="13" text-anchor="middle" fill="#555">例子：M1 的输入画面 1920×1080，stride 1920×1088，buffer 3,133,440 字节</text>

  <!-- 用户空间背景 -->
  <rect x="20" y="70" width="960" height="330" rx="10" fill="#f6f9ff" stroke="#9db8d9" stroke-dasharray="6,4"/>
  <text x="34" y="92" font-size="14" font-weight="bold" fill="#2c5d93">我们的程序（用户空间）</text>

  <!-- MppBuffer -->
  <rect x="40" y="110" width="220" height="130" rx="8" fill="#ffe3c2" stroke="#d08a3a"/>
  <text x="150" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">MppBuffer mppBuf</text>
  <text x="150" y="156" font-size="12" text-anchor="middle" fill="#555">MPP 的对象，里面记着：</text>
  <text x="56" y="180" font-size="12" fill="#333">• fd：这块内存的 dma_buf fd</text>
  <text x="56" y="200" font-size="12" fill="#333">• size：3,133,440 字节</text>
  <text x="56" y="220" font-size="12" fill="#333">• ptr：CPU 地址（RGA 用不到）</text>

  <!-- ① get_fd -->
  <line x1="260" y1="150" x2="356" y2="150" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="308" y="141" font-size="11" text-anchor="middle" fill="#444">① get_fd</text>
  <rect x="360" y="126" width="150" height="46" rx="6" fill="#ffffff" stroke="#888"/>
  <text x="435" y="146" font-size="13" text-anchor="middle" fill="#222">int dmaFd</text>
  <text x="435" y="163" font-size="11" text-anchor="middle" fill="#666">一个小整数，比如 7（举例）</text>

  <!-- ② get_size -->
  <line x1="260" y1="210" x2="356" y2="210" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="308" y="201" font-size="11" text-anchor="middle" fill="#444">② get_size</text>
  <rect x="360" y="186" width="150" height="46" rx="6" fill="#ffffff" stroke="#888"/>
  <text x="435" y="206" font-size="13" text-anchor="middle" fill="#222">int sizeBytes</text>
  <text x="435" y="223" font-size="11" text-anchor="middle" fill="#666">3,133,440</text>

  <!-- ③ importbuffer_fd -->
  <line x1="510" y1="150" x2="560" y2="175" stroke="#444" stroke-width="2"/>
  <line x1="510" y1="210" x2="560" y2="185" stroke="#444" stroke-width="2"/>
  <line x1="560" y1="180" x2="586" y2="180" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="590" y="110" width="370" height="140" rx="8" fill="#eef6ee" stroke="#4e9a3a"/>
  <text x="775" y="133" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">③ importbuffer_fd(dmaFd, sizeBytes)　librga</text>
  <text x="604" y="158" font-size="12" fill="#333">填一张表 rga_external_buffer：</text>
  <text x="620" y="178" font-size="12" fill="#333">memory = dmaFd　type = RGA_DMA_BUFFER</text>
  <text x="620" y="197" font-size="12" fill="#333">memory_info.size = sizeBytes　handle = 0（待填）</text>
  <text x="604" y="221" font-size="12" fill="#333">ioctl(/dev/rga 的 fd, RGA_IOC_IMPORT_BUFFER, &amp;表)</text>
  <text x="604" y="240" font-size="11" fill="#666">im2d_impl.cpp:1387；驱动把 handle 写回表里，函数返回它</text>

  <!-- 返回 handle -->
  <rect x="590" y="300" width="370" height="80" rx="8" fill="#d6ecff" stroke="#3d82c4" stroke-width="2"/>
  <text x="775" y="326" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f4f80">返回：rga_buffer_handle_t handle</text>
  <text x="775" y="348" font-size="12" text-anchor="middle" fill="#333">RGA 自己的编号。0 = 失败</text>
  <text x="775" y="367" font-size="12" text-anchor="middle" fill="#333">后面 wrapbuffer_handle、imresize 都只认它</text>
  <line x1="775" y1="250" x2="775" y2="296" stroke="#2c6fb0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- 下一步 -->
  <rect x="64" y="290" width="490" height="90" rx="8" fill="#ffffff" stroke="#bbb"/>
  <text x="78" y="314" font-size="13" font-weight="bold" fill="#222">拿到 handle 以后（resize_nv12_by_rga 里）：</text>
  <text x="78" y="336" font-size="12" fill="#333">wrapbuffer_handle(handle, 1920, 1080, NV12, 1920, 1088)　补上"画面怎么排"</text>
  <text x="78" y="355" font-size="12" fill="#333">imresize(src, dst)　RGA 按 handle 找到内存，读、写</text>
  <text x="78" y="374" font-size="12" fill="#333">releasebuffer_handle(handle)　注销编号（RGA_IOC_RELEASE_BUFFER）</text>

  <!-- 内核背景 -->
  <rect x="20" y="420" width="960" height="200" rx="10" fill="#fbf6ef" stroke="#c9a77a" stroke-dasharray="6,4"/>
  <text x="34" y="442" font-size="14" font-weight="bold" fill="#8a5a1c">内核</text>

  <!-- dma_buf -->
  <rect x="60" y="460" width="300" height="70" rx="8" fill="#ffffff" stroke="#d08a3a"/>
  <text x="210" y="486" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">dma_buf 对象</text>
  <text x="210" y="508" font-size="12" text-anchor="middle" fill="#555">dmaFd 指向它；它管着下面那块物理内存</text>

  <!-- RGA 驱动登记表 -->
  <rect x="590" y="455" width="370" height="150" rx="8" fill="#ffffff" stroke="#3d82c4"/>
  <text x="775" y="479" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">RGA 驱动（/dev/rga）的登记表</text>
  <line x1="610" y1="490" x2="940" y2="490" stroke="#ccc"/>
  <text x="625" y="510" font-size="12" fill="#666">handle</text>
  <text x="720" y="510" font-size="12" fill="#666">对应哪块内存</text>
  <text x="870" y="510" font-size="12" fill="#666">大小</text>
  <rect x="610" y="518" width="330" height="26" fill="#d6ecff"/>
  <text x="625" y="536" font-size="12" fill="#222">新编号</text>
  <text x="720" y="536" font-size="12" fill="#222">那个 dma_buf</text>
  <text x="870" y="536" font-size="12" fill="#222">3,133,440</text>
  <text x="625" y="562" font-size="12" fill="#999">……</text>
  <text x="610" y="590" font-size="11" fill="#8a5a1c">驱动这一侧没有源码，按 ioctl 接口推断</text>

  <!-- 物理内存 -->
  <rect x="60" y="560" width="300" height="46" rx="6" fill="#e8e8e8" stroke="#666"/>
  <text x="210" y="580" font-size="13" text-anchor="middle" fill="#222">物理内存：3,133,440 字节的 NV12 画面</text>
  <text x="210" y="598" font-size="11" text-anchor="middle" fill="#555">CPU、RGA、编码器读写的都是这一块</text>

  <!-- 连接线 -->
  <path d="M 50 240 L 50 495 L 56 495" stroke="#d08a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="58" y="394" font-size="11" fill="#8a5a1c">fd → dma_buf</text>
  <line x1="210" y1="530" x2="210" y2="556" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="775" y1="250" x2="775" y2="250" stroke="#444"/>
  <path d="M 960 180 L 972 180 L 972 530 L 964 530" stroke="#444" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="966" y="412" font-size="11" text-anchor="end" fill="#444">ioctl</text>
  <path d="M 610 531 L 364 495" stroke="#3d82c4" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="470" y="500" font-size="11" fill="#2c6fb0">记下：编号 → dma_buf</text>

  <!-- 总结 -->
  <text x="500" y="650" font-size="13" text-anchor="middle" fill="#222">不分配新内存、不复制数据：只是让 RGA 驱动"认识"这块内存，给它一个 RGA 自己的编号</text>
  <text x="500" y="674" font-size="12" text-anchor="middle" fill="#555">打个比方：fd 是这块内存在本程序里的"门牌号"，handle 是 RGA 登记簿上的"登记号"</text>
</svg>
