<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500">
<title>两个 ISP 的出口和 video 节点</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1080" height="500" rx="10" fill="#FFFFFF" stroke="#DDDDDD"/>
<text x="30" y="30" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="bold" dominant-baseline="middle">/dev/videoN 是 ISP 的出口：两个摄像头接口各接一个 ISP，每个 ISP 有主路、副路等出口</text>
<rect x="40" y="120" width="170" height="80" rx="8" fill="#FDEBD3" stroke="#B26A00" stroke-width="1.2"/>
<text x="125" y="150" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="14" fill="#B26A00" text-anchor="middle" font-weight="bold" dominant-baseline="middle">摄像头接口 A</text>
<text x="125" y="175" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" dominant-baseline="middle">（插 IMX415 排线）</text>
<line x1="210" y1="160" x2="270" y2="160" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="270" y="100" width="200" height="120" rx="8" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.2"/>
<text x="370" y="135" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="bold" dominant-baseline="middle">ISP0（rkisp0）</text>
<text x="370" y="162" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" dominant-baseline="middle">RAW → 正常图像</text>
<text x="370" y="184" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" dominant-baseline="middle">（像一台复印机）</text>
<line x1="470" y1="130" x2="560" y2="115" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="470" y1="190" x2="560" y2="205" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560" y="85" width="230" height="60" rx="8" fill="#F2F2F2" stroke="#555" stroke-width="1.2"/>
<text x="675" y="105" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" font-weight="bold" dominant-baseline="middle">出口 1：mainpath（主路）</text>
<text x="675" y="127" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" dominant-baseline="middle">大图（ISP0 没测上限）</text>
<rect x="560" y="175" width="230" height="60" rx="8" fill="#FFFFFF" stroke="#555" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="675" y="195" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle" font-weight="bold" dominant-baseline="middle">出口 2：selfpath（副路）</text>
<text x="675" y="217" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" dominant-baseline="middle">小图</text>
<line x1="790" y1="115" x2="830" y2="115" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="790" y1="205" x2="830" y2="205" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="840" y="115" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#555" text-anchor="start" font-weight="bold" dominant-baseline="middle">/dev/video22</text>
<text x="840" y="205" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#555" text-anchor="start" font-weight="normal" dominant-baseline="middle">/dev/video23</text>
<text x="560" y="258" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="normal" dominant-baseline="middle">摄像头插这个接口 → 用 /dev/video22</text>
<rect x="40" y="330" width="170" height="80" rx="8" fill="#FDEBD3" stroke="#B26A00" stroke-width="1.2"/>
<text x="125" y="360" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="14" fill="#B26A00" text-anchor="middle" font-weight="bold" dominant-baseline="middle">摄像头接口 B</text>
<text x="125" y="385" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" dominant-baseline="middle">（插 IMX415 排线）</text>
<line x1="210" y1="370" x2="270" y2="370" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="270" y="310" width="200" height="120" rx="8" fill="#E3F2E1" stroke="#2E7D32" stroke-width="1.2"/>
<text x="370" y="345" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="bold" dominant-baseline="middle">ISP1（rkisp1）</text>
<text x="370" y="372" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" dominant-baseline="middle">RAW → 正常图像</text>
<text x="370" y="394" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" dominant-baseline="middle">（像一台复印机）</text>
<line x1="470" y1="340" x2="560" y2="325" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="470" y1="400" x2="560" y2="415" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560" y="295" width="230" height="60" rx="8" fill="#DCE9F7" stroke="#2F5D9A" stroke-width="1.2"/>
<text x="675" y="315" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="13" fill="#2F5D9A" text-anchor="middle" font-weight="bold" dominant-baseline="middle">出口 1：mainpath（主路）</text>
<text x="675" y="337" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" dominant-baseline="middle">大图，最宽 3840（实测）</text>
<rect x="560" y="385" width="230" height="60" rx="8" fill="#FFFFFF" stroke="#2F5D9A" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="675" y="405" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="13" fill="#2F5D9A" text-anchor="middle" font-weight="bold" dominant-baseline="middle">出口 2：selfpath（副路）</text>
<text x="675" y="427" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" dominant-baseline="middle">小图，最宽 1920（实测）</text>
<line x1="790" y1="325" x2="830" y2="325" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="790" y1="415" x2="830" y2="415" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="840" y="325" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#2F5D9A" text-anchor="start" font-weight="bold" dominant-baseline="middle">/dev/video31</text>
<text x="840" y="415" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#555" text-anchor="start" font-weight="normal" dominant-baseline="middle">/dev/video32</text>
<text x="560" y="468" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="12" fill="#B23" text-anchor="start" font-weight="bold" dominant-baseline="middle">摄像头插这个接口 → 用 /dev/video31 ← 总计划默认</text>
</svg>
